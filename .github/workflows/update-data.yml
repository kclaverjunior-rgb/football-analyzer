name: Mise à jour Football Analyzer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les données football
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          url = f"https://www.sofascore.com/api/v1/sport/football/scheduled-events/{date}"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          matches = []

          for event in data.get("events", []):
              home = event.get("homeTeam", {})
              away = event.get("awayTeam", {})

              if not home.get("id") or not away.get("id"):
                  continue

              matches.append({
                  "id": event.get("id"),
                  "home": home.get("name"),
                  "away": away.get("name"),
                  "league": (
                      event.get("tournament", {}).get("name")
                      or "Compétition"
                  ),
                  "time": event.get("startTimestamp")
              })

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "matches": matches
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"{len(matches)} matchs récupérés")
          PY

      - name: Enregistrer les données
        run: |
          git config user.name "Football Analyzer Bot"
          git config user.email "actions@github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Mise à jour des matchs"

          git push
